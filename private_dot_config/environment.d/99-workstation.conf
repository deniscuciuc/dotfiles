# Run after Ubuntu's 99-environment.conf so /etc/environment cannot reset PATH.
# Applies to systemd user services and desktop applications after the next login.
PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}
EDITOR=nano
DOCKER_HOST=${DOCKER_HOST:-unix://${XDG_RUNTIME_DIR}/podman/podman.sock}
